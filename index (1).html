function resolveForRegion(item,region){
  if(!item?.regions?.[region])return item;
  const r=item.regions[region];
  return{...item,bin:r.bin||item.bin,tip:r.tip||item.tip,conditions:r.conditions||item.conditions};
}
function findItem(query,region){
  const q=(query||'').trim().toLowerCase();if(!q)return null;
  let hit=ITEMS.find(i=>i.name.toLowerCase()===q);
  if(!hit)hit=ITEMS.find(i=>i.aliases?.some(a=>a.toLowerCase()===q));
  if(!hit)hit=ITEMS.find(i=>i.name.toLowerCase().includes(q)||q.includes(i.name.toLowerCase()));
  if(!hit)hit=ITEMS.find(i=>i.aliases?.some(a=>a.toLowerCase().includes(q)||q.includes(a.toLowerCase())));
  return hit?resolveForRegion(hit,region):null;
}
function searchItems(query,region,limit=6){
  const q=(query||'').trim().toLowerCase();if(!q)return[];
  const scored=ITEMS.map(i=>{
    let s=0;
    if(i.name.toLowerCase().startsWith(q))s+=5;
    else if(i.name.toLowerCase().includes(q))s+=3;
    if(i.aliases?.some(a=>a.toLowerCase().startsWith(q)))s+=4;
    else if(i.aliases?.some(a=>a.toLowerCase().includes(q)))s+=2;
    return{item:i,score:s};
  }).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit).map(x=>resolveForRegion(x.item,region));
}

// ── KEY FIX: recycling = yellow in NZ, blue elsewhere ─────────
function getBinColor(key,region){
  const b=BINS[key];if(!b)return'#888';
  return(region==='NZ'&&b.nzColor)?b.nzColor:b.color;
}
function getBinFg(key,region){
  if(region==='NZ'&&(key==='recycling'||key==='glass'))return'#1a1410';
  return BINS[key]?.fg||'#fff';
}

function BinChip({bin,region}){
  const b=BINS[bin];if(!b)return null;
  const isNZ=region==='NZ'&&b.nzLabel;
  const color=isNZ&&b.nzColor?b.nzColor:b.color;
  const label=isNZ?b.nzLabel:b.short;
  const fg=(isNZ&&(bin==='recycling'||bin==='glass'))?'#1a1410':b.fg;
  return(
    <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 9px',borderRadius:4,background:color,color:fg,fontSize:10,fontWeight:600,letterSpacing:0.4,textTransform:'uppercase',fontFamily:'"Geist Mono",ui-monospace,monospace',whiteSpace:'nowrap'}}>
      <span style={{width:5,height:5,borderRadius:1,background:fg,opacity:.7}}/>{label}
    </span>
  );
}

async function askClaude(query,region){
  const hints={NZ:'Yellow=recycling(plastics 1/2/5,paper,card,metal),Green=food+garden,Red=general,Glass crate.',UK:'3-stream:recycling,food waste,general.',US:'Single-stream recycling.',AU:'Yellow recycling,green organics,red general.',EU:'Separate paper,plastic,metal,glass,bio-waste.',CA:'Blue box recyclables,green organics.'};
  const prompt=`Recycling helper for ${region}. ${hints[region]||''}\nItem to dispose: "${query}".\nJSON only: {"bin":"<recycling|compost|general|glass|ewaste|hazardous|textiles|special>","name":"<capitalised>","tip":"<under 20 words>"}\nBe confident.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const raw=data.content?.[0]?.text||'';
    const m=raw.match(/\{[\s\S]*\}/);if(!m)return null;
    const obj=JSON.parse(m[0]);if(!obj.bin||!BINS[obj.bin])return null;
    return{id:'ai_'+Date.now().toString(36),name:obj.name||query,bin:obj.bin,tip:obj.tip||'',aiGenerated:true};
  }catch{return null;}
}

function DecideScreen({region,recent,onDecide,onBrowse,onChangeRegion}){
  const [query,setQuery]=useState('');
  const suggestions=useMemo(()=>searchItems(query,region,5),[query,region]);
  const quickPicks=useMemo(()=>QUICK.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean).map(it=>resolveForRegion(it,region)),[region]);
  const submit=(text)=>{const q=text||query;if(!q.trim())return;onDecide({query:q,item:findItem(q,region)});setQuery('');};
  return(
    <div style={{height:'100%',background:'#F5F1E8',color:'#141210',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'44px 20px 0',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <h1 style={{margin:0,fontFamily:'"Space Grotesk",system-ui,sans-serif',fontWeight:700,fontSize:42,lineHeight:.95,letterSpacing:-1.5}}>DUMP<span style={{color:'#1E5DDB'}}>?</span></h1>
          <div style={{marginTop:5,fontSize:10,letterSpacing:1.4,textTransform:'uppercase',color:'#6E6962',fontFamily:'"Geist Mono",ui-monospace,monospace'}}>Which bin does it go in?</div>
        </div>
        <button onClick={onChangeRegion} style={{padding:'6px 10px',borderRadius:999,border:'1px solid #E3DCCB',background:'transparent',fontFamily:'"Geist Mono",ui-monospace,monospace',fontSize:10,color:'#141210',display:'inline-flex',alignItems:'center',gap:5,textTransform:'uppercase',letterSpacing:.7}}>
          <span style={{width:5,height:5,borderRadius:5,background:'#2D7A3A'}}/>{region}
        </button>
      </div>

      <div style={{padding:'20px 16px 0'}}>
        <div style={{background:'#fff',border:'2px solid #141210',borderRadius:12,padding:3,display:'flex',alignItems:'center',gap:3,boxShadow:'3px 3px 0 #141210'}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="Type an item — pizza box, vape…" style={{flex:1,padding:'11px 12px',border:'none',outline:'none',background:'transparent',fontSize:13,color:'#141210'}}/>
          <button onClick={()=>submit()} disabled={!query.trim()} style={{padding:'11px 14px',borderRadius:9,border:'none',background:query.trim()?'#141210':'#E3DCCB',color:query.trim()?'#F5F1E8':'#6E6962',fontFamily:'"Geist Mono",ui-monospace,monospace',fontSize:10,fontWeight:600,letterSpacing:.8,textTransform:'uppercase'}}>Dump it</button>
        </div>
        {query.trim()&&suggestions.length>0&&(
          <div style={{marginTop:6,background:'#fff',border:'1px solid #E3DCCB',borderRadius:10,overflow:'hidden',animation:'fadeIn 120ms'}}>
            {suggestions.map((s,i)=>(
              <button key={s.id} onClick={()=>{setQuery('');onDecide({query:s.name,item:s});}} style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'10px 12px',border:'none',background:'transparent',borderTop:i?'1px solid #E3DCCB':'none',textAlign:'left'}}>
                <span style={{flex:1,fontSize:13,color:'#141210'}}>{s.name}</span>
                <BinChip bin={s.bin} region={region}/>
              </button>
            ))}
          </div>
        )}
        {query.trim()&&suggestions.length===0&&(
          <div style={{marginTop:6,padding:'10px 12px',borderRadius:10,border:'1px dashed #E3DCCB',background:'#fff',fontSize:12,color:'#6E6962'}}>
            Not in our list. Tap <strong style={{color:'#141210'}}>Dump it</strong> to ask the AI.
          </div>
        )}
      </div>

      <div style={{padding:'16px 20px 0'}}>
        <div style={{fontSize:9,letterSpacing:1.4,textTransform:'uppercase',color:'#6E6962',marginBottom:8,fontFamily:'"Geist Mono",ui-monospace,monospace'}}>Common confusions</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {quickPicks.map(it=>(
            <button key={it.id} onClick={()=>onDecide({query:it.name,item:it})} style={{padding:'6px 10px',borderRadius:999,border:'1px solid #E3DCCB',background:'#fff',fontSize:11,color:'#141210'}}>{it.name}</button>
          ))}
        </div>
      </div>

      {recent.length>0&&(
        <div style={{padding:'16px 20px 0'}}>
          <div style={{fontSize:9,letterSpacing:1.4,textTransform:'uppercase',color:'#6E6962',marginBottom:8,fontFamily:'"Geist Mono",ui-monospace,monospace'}}>Recently dumped</div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {recent.slice(0,4).map((r,i)=>(
              <button key={i} onClick={()=>onDecide(r)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',borderRadius:10,background:'#fff',border:'1px solid #E3DCCB',textAlign:'left'}}>
                <span style={{fontSize:13,color:'#141210'}}>{r.query}</span>
                <BinChip bin={r.bin||r.item?.bin||'general'} region={region}/>
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{flex:1}}/>
      <div style={{padding:'10px 16px 28px',background:'linear-gradient(to top,#F5F1E8 60%,rgba(245,241,232,0))'}}>
        <button onClick={onBrowse} style={{width:'100%',padding:'12px 14px',borderRadius:12,background:'transparent',border:'1px solid #141210',color:'#141210',fontSize:13,fontWeight:500,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:8}}>
            <span style={{display:'inline-flex',gap:2}}>
              {BIN_ORDER.slice(0,4).map(k=><span key={k} style={{width:3,height:12,borderRadius:1,background:getBinColor(k,region)}}/>)}
            </span>
            Browse all bins
          </span>
          <span style={{fontFamily:'"Geist Mono",ui-monospace,monospace',fontSize:10,color:'#6E6962'}}>{ITEMS.length} items</span>
        </button>
      </div>
    </div>
  );
}

function ResultScreen({initial,region,onBack,onRemember}){
  const [item,setItem]=useState(initial.item);
  const [pickedBin,setPickedBin]=useState(initial.item?.bin||null);
  const [loading,setLoading]=useState(!initial.item);
  const [override,setOverride]=useState(false);
  const [revealed,setRevealed]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    if(!initial.item&&initial.query){
      askClaude(initial.query,region).then(res=>{
        if(cancelled)return;
        if(res){setItem(res);setPickedBin(res.bin);}
        else{setPickedBin('general');setItem({name:initial.query,bin:'general',tip:'When in doubt, general waste is safest.'});}
        setLoading(false);
      });
    }
    return()=>{cancelled=true;};
  },[]);

  useEffect(()=>{if(!loading){const t=setTimeout(()=>setRevealed(true),30);return()=>clearTimeout(t);}},[loading]);
  useEffect(()=>{if(!loading&&item&&pickedBin)onRemember({query:initial.query,item,bin:pickedBin});},[loading]);

  const bin=pickedBin?BINS[pickedBin]:null;
  const activeCondition=useMemo(()=>item?.conditions?.find(c=>c.bin===pickedBin&&pickedBin!==item.bin),[item,pickedBin]);
  const displayColor=bin?getBinColor(pickedBin,region):'#333';
  const displayFg=bin?getBinFg(pickedBin,region):'#fff';
  const displayLabel=(region==='NZ'&&bin?.nzLabel)?bin.nzLabel:bin?.label;

  if(loading){
    return(
      <div style={{height:'100%',background:'#F5F1E8',color:'#141210',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'30px 20px'}}>
        <div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:1.4,textTransform:'uppercase',color:'#6E6962',marginBottom:12}}>Asking the AI…</div>
        <div style={{fontFamily:'"Space Grotesk",system-ui,sans-serif',fontSize:22,fontWeight:600,lineHeight:1.1,textAlign:'center',letterSpacing:-.5}}>"{initial.query}"</div>
        <div style={{marginTop:20,display:'flex',gap:6}}>
          {BIN_ORDER.map((k,i)=><div key={k} style={{width:5,height:20,borderRadius:1,background:getBinColor(k,region),animation:`binPulse 1.2s ${i*.1}s infinite ease-in-out`}}/>)}
        </div>
      </div>
    );
  }

  return(
    <div style={{height:'100%',position:'relative',background:'#F5F1E8',overflow:'hidden'}}>
      <div style={{position:'absolute',left:0,right:0,bottom:0,height:revealed?'100%':'0%',background:displayColor,transition:'height 600ms cubic-bezier(.2,.8,.2,1)'}}/>
      <div style={{position:'relative',height:'100%',display:'flex',flexDirection:'column',padding:'44px 20px 28px',color:displayFg,opacity:revealed?1:0,transition:'opacity 400ms 300ms'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <button onClick={onBack} style={{padding:'6px 10px',borderRadius:999,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.25)',color:'inherit',fontSize:11,cursor:'pointer'}}>← Back</button>
          {item?.aiGenerated&&<span style={{padding:'3px 8px',borderRadius:4,background:'rgba(255,255,255,.18)',fontFamily:'"Geist Mono",monospace',fontSize:8,letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>AI guess</span>}
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
          <div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:1.8,textTransform:'uppercase',opacity:.7,marginBottom:8}}>For your "{item?.name||initial.query}"</div>
          <div style={{fontFamily:'"Space Grotesk",system-ui,sans-serif',fontWeight:700,fontSize:52,lineHeight:.9,letterSpacing:-2,marginBottom:3}}>{displayLabel}</div>
          {region==='NZ'&&bin?.nzLabel&&<div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:1.2,textTransform:'uppercase',opacity:.6,marginTop:3,marginBottom:5}}>aka {bin.label}</div>}
          <div style={{fontSize:13,lineHeight:1.4,marginTop:12,opacity:.92,maxWidth:260}}>{activeCondition?activeCondition.tip:(item?.tip||bin?.blurb)}</div>
          {item?.conditions?.length>0&&(
            <div style={{marginTop:20}}>
              <div style={{fontFamily:'"Geist Mono",monospace',fontSize:9,letterSpacing:1.4,textTransform:'uppercase',opacity:.7,marginBottom:8}}>Unless…</div>
              <div style={{display:'flex',flexDirection:'column',gap:5}}>
                {[{test:'Default',bin:item.bin,tip:item.tip},...item.conditions].map((c,idx)=>{
                  const active=c.bin===pickedBin;
                  return(
                    <button key={idx} onClick={()=>setPickedBin(c.bin)} style={{padding:'10px 12px',borderRadius:9,textAlign:'left',background:active?'rgba(255,255,255,.20)':'rgba(255,255,255,.06)',border:'1px solid '+(active?'rgba(255,255,255,.6)':'rgba(255,255,255,.18)'),color:'inherit',fontSize:12,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span>{c.test}</span>
                      <span style={{padding:'2px 7px',borderRadius:4,background:BINS[c.bin].color,color:BINS[c.bin].fg,fontFamily:'"Geist Mono",monospace',fontSize:8,letterSpacing:.7,textTransform:'uppercase',fontWeight:600}}>{BINS[c.bin].short}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <button onClick={()=>setOverride(o=>!o)} style={{padding:'10px 12px',borderRadius:9,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.25)',color:'inherit',fontSize:12,cursor:'pointer'}}>{override?'Cancel':'Wrong bin? Override'}</button>
          {override&&(
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:4}}>
              {BIN_ORDER.map(k=>{
                const b=BINS[k];const active=k===pickedBin;
                return(
                  <button key={k} onClick={()=>{setPickedBin(k);setOverride(false);}} style={{padding:'8px 4px',borderRadius:7,border:'none',background:active?displayFg:'rgba(255,255,255,.15)',color:active?displayColor:'inherit',fontFamily:'"Geist Mono",monospace',fontSize:8,letterSpacing:.5,textTransform:'uppercase',fontWeight:600,cursor:'pointer'}}>
                    <div style={{width:12,height:5,background:getBinColor(k,region),borderRadius:1,margin:'0 auto 3px'}}/>
                    {b.label.split(' ')[0]}
                  </button>
                );
              })}
            </div>
          )}
          <button onClick={onBack} style={{padding:'12px 14px',borderRadius:9,background:displayFg,color:displayColor,border:'none',fontSize:13,fontWeight:600,cursor:'pointer'}}>Dump another</button>
        </div>
      </div>
    </div>
  );
}

function BrowseScreen({region,onBack,onPickItem}){
  const [openBin,setOpenBin]=useState(BIN_ORDER[0]);
  const byBin=useMemo(()=>{
    const out={};BIN_ORDER.forEach(k=>out[k]=[]);
    ITEMS.forEach(i=>{const r=resolveForRegion(i,region);if(out[r.bin])out[r.bin].push(r);});
    return out;
  },[region]);
  const open=BINS[openBin];
  return(
    <div style={{height:'100%',background:'#F5F1E8',color:'#141210',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'44px 14px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <button onClick={onBack} style={{padding:'6px 10px',borderRadius:999,background:'transparent',border:'1px solid #E3DCCB',color:'#141210',fontSize:12,cursor:'pointer'}}>← Done</button>
        <div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:1.3,textTransform:'uppercase',color:'#6E6962'}}>Bin guide · {region}</div>
        <div style={{width:52}}/>
      </div>
      {REGION_NOTES[region]&&(
        <div style={{margin:'10px 18px 0',padding:'10px 12px',borderRadius:10,background:'#fff',border:'1px solid #E3DCCB',fontSize:11,color:'#6E6962',lineHeight:1.45}}>
          <span style={{fontFamily:'"Geist Mono",monospace',fontSize:8,letterSpacing:1.3,textTransform:'uppercase',color:'#141210',fontWeight:600,marginRight:5}}>{region}</span>
          {REGION_NOTES[region]}
        </div>
      )}
      <div style={{padding:'14px 16px 0'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:5}}>
          {BIN_ORDER.map(k=>{
            const b=BINS[k];const isOpen=openBin===k;
            const col=getBinColor(k,region);const fg=getBinFg(k,region);
            return(
              <button key={k} onClick={()=>setOpenBin(k)} style={{padding:'11px 12px',borderRadius:9,textAlign:'left',background:isOpen?col:'#fff',color:isOpen?fg:'#141210',border:'1px solid '+(isOpen?col:'#E3DCCB'),cursor:'pointer',display:'flex',flexDirection:'column',gap:6,minHeight:64}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{width:10,height:10,borderRadius:2,background:isOpen?fg:col}}/>
                  <span style={{fontFamily:'"Geist Mono",monospace',fontSize:9,fontWeight:600,opacity:.7}}>{byBin[k].length}</span>
                </div>
                <div style={{fontFamily:'"Space Grotesk",system-ui,sans-serif',fontSize:14,fontWeight:600,lineHeight:1.05,letterSpacing:-.2}}>{b.label}</div>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'14px 18px 30px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:12}}>
          <div style={{width:4,alignSelf:'stretch',borderRadius:1,background:getBinColor(openBin,region)}}/>
          <div style={{flex:1}}>
            <div style={{fontFamily:'"Space Grotesk",system-ui,sans-serif',fontSize:20,fontWeight:600,lineHeight:1,letterSpacing:-.3}}>{open.label}</div>
            <p style={{margin:'4px 0 0',fontSize:12,color:'#6E6962',lineHeight:1.4}}>{open.blurb}</p>
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {byBin[openBin].map(it=>(
            <button key={it.id} onClick={()=>onPickItem(it)} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'10px 12px',borderRadius:9,background:'#fff',border:'1px solid #E3DCCB',textAlign:'left',cursor:'pointer'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:'#141210',fontWeight:500}}>{it.name}</div>
                <div style={{fontSize:11,color:'#6E6962',marginTop:2,lineHeight:1.35}}>{it.tip}</div>
              </div>
              {it.conditions?.length>0&&<span style={{flexShrink:0,padding:'2px 6px',borderRadius:4,fontFamily:'"Geist Mono",monospace',fontSize:8,letterSpacing:.7,textTransform:'uppercase',fontWeight:600,background:'#E3DCCB',color:'#141210'}}>{it.conditions.length+1} cases</span>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const REGIONS=['NZ','AU','UK','US','EU','CA'];
const RF={NZ:'New Zealand',AU:'Australia',UK:'United Kingdom',US:'United States',EU:'European Union',CA:'Canada'};

function RegionScreen({region,onPick,onCancel}){
  return(
    <div style={{height:'100%',background:'#F5F1E8',color:'#141210',display:'flex',flexDirection:'column',padding:'44px 20px 24px'}}>
      <button onClick={onCancel} style={{alignSelf:'flex-start',padding:'6px 10px',borderRadius:999,background:'transparent',border:'1px solid #E3DCCB',color:'#141210',fontSize:12,cursor:'pointer'}}>← Back</button>
      <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <div style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:1.4,textTransform:'uppercase',color:'#6E6962'}}>Set your region</div>
        <h1 style={{margin:'5px 0 14px',fontFamily:'"Space Grotesk",system-ui,sans-serif',fontWeight:700,fontSize:36,lineHeight:.95,letterSpacing:-1.2}}>Where do you live?</h1>
        <p style={{margin:'0 0 18px',fontSize:13,color:'#6E6962',lineHeight:1.4}}>Recycling rules vary a lot. We adjust advice to your area.</p>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {REGIONS.map(r=>(
            <button key={r} onClick={()=>onPick(r)} style={{padding:'13px 16px',borderRadius:10,textAlign:'left',background:region===r?'#141210':'#fff',color:region===r?'#F5F1E8':'#141210',border:'1px solid '+(region===r?'#141210':'#E3DCCB'),fontSize:14,fontWeight:500,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>{RF[r]}</span>
              <span style={{fontFamily:'"Geist Mono",monospace',fontSize:10,letterSpacing:.8,opacity:.7}}>{r}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [region,setRegion]=useState('NZ');
  const [recent,setRecent]=useState([]);
  const [view,setView]=useState('decide');
  const [current,setCurrent]=useState(null);

  const decide=(payload)=>{setCurrent(payload);setView('result');};
  const remember=(entry)=>setRecent(prev=>{
    const f=prev.filter(r=>r.query.toLowerCase()!==entry.query.toLowerCase());
    return[entry,...f].slice(0,10);
  });

  return(
    <div style={{minHeight:'100vh',background:'radial-gradient(900px 500px at 50% 0%,#EAE6DA 0%,#C8C0A8 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:'30px 16px'}}>
      <Phone>
        {view==='decide'&&<DecideScreen region={region} recent={recent} onDecide={decide} onBrowse={()=>setView('browse')} onChangeRegion={()=>setView('region')}/>}
        {view==='result'&&current&&<ResultScreen initial={current} region={region} onBack={()=>setView('decide')} onRemember={remember}/>}
        {view==='browse'&&<BrowseScreen region={region} onBack={()=>setView('decide')} onPickItem={it=>decide({query:it.name,item:it})}/>}
        {view==='region'&&<RegionScreen region={region} onPick={r=>{setRegion(r);setView('decide');}} onCancel={()=>setView('decide')}/>}
      </Phone>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
